<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="공부 타이머">
<title>공부 타이머</title>
<style>
@property --t{syntax:'<color>';inherits:true;initial-value:#888}
@property --b{syntax:'<color>';inherits:true;initial-value:#ccc}
:root{--t:#888;--b:#ccc;--moss:0;--bld:#555;--bld2:#444;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"SF Pro Display","Apple SD Gothic Neo",sans-serif;color:#fff}
#app{position:fixed;inset:0;max-width:520px;margin:auto;overflow:hidden;transition:--t 4s,--b 4s;background:linear-gradient(var(--t),var(--b))}
.cloud{position:absolute;height:34px;border-radius:30px;background:rgba(255,255,255,.55);filter:blur(7px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sky-svg{position:absolute;left:0;right:0;bottom:7%;width:100%;height:56%}
#far{opacity:.55}
.moss{opacity:var(--moss);transition:opacity 4s}
#grass{position:absolute;left:0;right:0;bottom:0;height:11%;background:linear-gradient(#2c3a2a,#1a2218)}
.blade{position:absolute;bottom:100%;width:5px;border-radius:5px 5px 0 0;background:#4f8a4a;transform-origin:bottom;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(9deg)}}
#bench{position:absolute;right:2%;bottom:8%;width:66%;height:17%}
#bench i{position:absolute;background:#6b4a30;border-radius:4px;box-shadow:0 3px 0 #3b2818}
#shade{position:absolute;inset:0;background:#000a1c;opacity:0;pointer-events:none;transition:opacity 2s}
#chara{position:absolute;right:2%;bottom:10%;height:58%;aspect-ratio:562/900;cursor:pointer;transform-origin:50% 100%;transition:transform .5s,filter 1.5s}
#chara img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 10px #0006)}
#chara.idle{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.012)}}
#chara.pop{animation:pop .45s}
@keyframes pop{30%{transform:translateY(-14px) rotate(-2deg)}60%{transform:translateY(0) rotate(1.5deg)}}
#chara.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#chara.sleepy{filter:brightness(.82);transform:rotate(1.5deg) translateY(6px)}
#chara.sleep{filter:brightness(.6);transform:rotate(3deg) translateY(14px) scaleY(.97)}
#say{position:absolute;right:8%;bottom:70%;background:#fffe;color:#222;padding:8px 14px;border-radius:16px;font-size:14px;opacity:0;transition:opacity .3s;max-width:60%;pointer-events:none}
#say.on{opacity:1}
#zzz{position:absolute;right:30%;bottom:66%;font-size:26px;font-weight:700;opacity:0;pointer-events:none}
#zzz.on{opacity:1;animation:zz 2.2s infinite}
@keyframes zz{from{transform:translateY(12px);opacity:0}30%{opacity:1}to{transform:translateY(-26px);opacity:0}}
.ui{position:absolute;inset:0;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);display:flex;flex-direction:column;pointer-events:none}
.ui>*{pointer-events:auto}
#chips{display:flex;gap:6px;margin-top:12px;justify-content:center}
.chip{padding:6px 12px;border-radius:99px;background:#0005;font-size:12px;border:1px solid #fff3;backdrop-filter:blur(6px);color:#fff}
.chip.on{background:#fff;color:#111}
#clock{text-align:center;margin-top:5vh;font-weight:200;font-size:min(26vw,120px);letter-spacing:-2px;line-height:1;text-shadow:0 2px 20px #0006;font-variant-numeric:tabular-nums}
#date{text-align:center;font-size:17px;font-weight:500;opacity:.9;margin-top:6px;text-shadow:0 1px 8px #0008}
#sub{text-align:center;font-size:13px;opacity:.8;margin-top:6px;height:18px}
.btns{margin-top:auto;display:flex;flex-direction:column;gap:10px;width:42%;padding-bottom:14px}
.btn{padding:14px;border-radius:16px;border:0;font-size:16px;font-weight:600;background:#fffd;color:#111;backdrop-filter:blur(8px)}
.btn.g{background:#0007;color:#fff;border:1px solid #fff3}
.btn.r{background:#e5484dee;color:#fff}
.hide{display:none!important}
#modal{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
#box{background:#1c1c22;border-radius:20px;padding:22px;width:100%;max-width:560px;max-height:80%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#box h3{margin:0;font-size:18px}#box p{margin:0;opacity:.8;font-size:14px;line-height:1.5}
textarea{width:100%;height:80px;border-radius:12px;border:1px solid #fff3;background:#0004;color:#fff;padding:10px;font-size:15px;user-select:text}
.row{display:flex;gap:8px}.row .btn{flex:1}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{background:#ffffff12;border-radius:12px;padding:10px;font-size:12px;opacity:.95}.stat b{display:block;font-size:18px;margin-top:2px}
.rec{font-size:13px;padding:8px 0;border-top:1px solid #fff1}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

#app{max-width:none;margin:0;width:100%}
#city{position:absolute;inset:0}
.cl{animation:cdrift 50s ease-in-out infinite alternate}@keyframes cdrift{to{transform:translateX(70px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twk 3s ease-in-out infinite}@keyframes twk{50%{transform:scale(.35);opacity:.4}}
.gear{animation:spin 9s linear infinite;transform-box:view-box}@keyframes spin{to{transform:rotate(360deg)}}
.moss{opacity:var(--moss);transition:opacity 4s}
#ground{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#d3d6e0,#9096ac);border-top:5px solid #fff8}
#ground::before{content:"";position:absolute;left:0;width:42%;top:30%;bottom:0;background:repeating-linear-gradient(90deg,#fffc 0 34px,transparent 34px 68px);opacity:.55;transform:skewX(-20deg)}
#ground[data-c=apoc]{background:linear-gradient(#8a8a82,#5e5e58)}
#ground[data-c=cyber]{background:linear-gradient(#2a1a5e,#120a30);border-top-color:#41f0ff}
#ground[data-c=steam]{background:repeating-linear-gradient(90deg,#8a6a4a 0 46px,#7a5c3e 46px 50px);border-top-color:#e6bd62}
.blade{background:#5fb050}#ground[data-c=cyber] .blade{background:#41f0ff;box-shadow:0 0 6px #41f0ff}#ground[data-c=steam] .blade{background:#8a9a3a}
#shop{position:absolute;right:0;bottom:calc(12% - 8px);width:var(--sw);aspect-ratio:5/4}
:root{--sw:min(80vw,90vh)}
#chara{height:calc(var(--sw)*.54);right:calc(var(--sw)*.27);bottom:calc(12% - 22px)}
#say{right:calc(var(--sw)*.25);bottom:calc(12% + var(--sw)*.52);max-width:40vw}
#zzz{right:calc(var(--sw)*.45);bottom:calc(12% + var(--sw)*.5)}
.ui{padding-left:max(28px,env(safe-area-inset-left))}
#chips{justify-content:flex-start;flex-wrap:wrap}
#clock{text-align:left;font-size:min(20vw,180px);margin-top:4vh}
#date{text-align:left;font-size:min(4vw,24px)}#sub{text-align:left}
#clock2,#sub2{text-align:left!important}#clock2{font-size:min(16vw,150px)!important}
.btns{width:min(300px,45%)}
.btn{padding:16px;font-size:18px}
#mctl{position:absolute;top:max(12px,env(safe-area-inset-top));right:16px;z-index:5;display:flex;align-items:center;gap:8px}
#mctl input{width:90px;accent-color:#fff}
#box{max-width:560px}#modal{align-items:center}#box{margin:auto}
</style></head><body>
<div id="app">
 <div id="city"></div><div id="ground"></div><div id="shop"></div><div id="shade"></div>
 <div id="chara" class="idle"><img id="img" alt=""></div><div id="say"></div><div id="zzz">Z z z</div>
 <div class="ui" id="home">
  <div id="chips"></div><div id="clock">00:00</div><div id="date"></div><div id="sub"></div>
  <div class="btns"><button class="btn" id="bStart">타이머 시작</button><button class="btn g" id="bRec">기록</button></div>
 </div>
 <div class="ui hide" id="run">
  <div id="clock2" style="text-align:center;margin-top:7vh;font-weight:200;font-size:min(20vw,92px);font-variant-numeric:tabular-nums;text-shadow:0 2px 20px #0006">00:00:00</div>
  <div id="sub2" style="text-align:center;font-size:13px;opacity:.85;margin-top:8px"></div>
  <div class="btns"><button class="btn" id="bPause">일시정지</button><button class="btn r" id="bEnd">종료</button></div>
 </div>
 <div id="mctl"><button class="chip" id="mBtn"></button><input type="range" id="vol" min="0" max="1" step=".05"></div><div id="toast"></div><div id="modal" class="hide"><div id="box"></div></div>
</div>

let AC,mst,vrb,trk=null,mus=$s("st_mus")!==false,vol=$s("st_vol")!=null?$s("st_vol"):.5;

function actx(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mst=AC.createGain();mst.gain.value=0;const n=AC.sampleRate*2.6,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}vrb=AC.createConvolver();vrb.buffer=b;const vg=AC.createGain();vg.gain.value=.55;vrb.connect(vg);vg.connect(mst);mst.connect(AC.destination)}if(AC.state!="running")AC.resume();return AC}
function setVol(){if(mst)mst.gain.setTargetAtTime(vol*.9,AC.currentTime,.1)}
function tone(b,f,t,d,ty,g,att,lp){att=att||.02;const o=AC.createOscillator(),e=AC.createGain();o.type=ty;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+att);e.gain.exponentialRampToValueAtTime(.0001,t+d);let n=o;if(lp){const l=AC.createBiquadFilter();l.type="lowpass";l.frequency.value=lp;o.connect(l);n=l}n.connect(e);e.connect(b);o.start(t);o.stop(t+d+.1)}
const TR={

steam:{dt:.42,s(i,t,b){const B=[38,43,45,38],C=[[62,65,69],[62,67,70],[61,64,69],[62,65,69]],k=Math.floor(i/6)%4;if(i%3==0)tone(b,mf(B[k]),t,.9,"triangle",.1,.02,700);else C[k].forEach(m=>tone(b,mf(m),t,.35,"triangle",.03,.01,1200));if(i%6==0)C[k].forEach(m=>tone(b,mf(m-12),t,2.4,"sine",.03,.6));if(Math.random()<.55)tone(b,mf(RR([74,77,79,81,82,86])),t,1.8,"sine",.06);tone(b,3200,t,.03,"square",.004)}}

function setTrack(){if(!AC)return;const now=AC.currentTime;
 if(trk&&(trk.id!=city||!mus)){const o=trk;o.bus.gain.setTargetAtTime(0,now,.8);setTimeout(()=>{o.stop&&o.stop();clearInterval(o.iv);o.bus.disconnect()},4000);trk=null}
 if(mus&&!trk){const bs=AC.createGain();bs.gain.value=0;bs.connect(mst);bs.connect(vrb);bs.gain.setTargetAtTime(1,now,1.5);const o=Object.create(TR[city]);o.id=city;o.bus=bs;o.i=0;o.nt=now+.1;if(o.init)o.init(bs);o.iv=setInterval(()=>{while(o.nt<AC.currentTime+.8){o.s(o.i++,o.nt,bs);o.nt+=o.dt}},200);trk=o}}

 say("후아암… 방금 깼어…",3500)};
window.saveRec=(d,skip)=>{if(!skip&&d>=1e3){recs.unshift({s:ses.start,d,m:($("memo")||{}).value||"",c:ses.city});$w("st_recs",recs)}ses={run:false,on:false,base:0,since:0,seen:0,start:0,city};save();closeM();view("home");stage(true);toast(skip?"저장하지 않았어요":"기록을 저장했어요")};
$("bRec").onclick=()=>{const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),sum=t=>recs.filter(r=>r.s>=t).reduce((a,r)=>a+r.d,0),
 wk=d0-((n.getDay()+6)%7)*864e5,mo=new Date(n.getFullYear(),n.getMonth(),1).getTime(),mx=recs.reduce((a,r)=>Math.max(a,r.d),0);
 modal(`<h3>집중 기록</h3><div class="stat"><div>오늘<b>${dur(sum(d0))}</b></div><div>이번 주<b>${dur(sum(wk))}</b></div><div>이번 달<b>${dur(sum(mo))}</b></div><div>최장 집중<b>${dur(mx)}</b></div></div>`+
 (recs.slice(0,30).map(r=>`<div class="rec"><b>${dur(r.d)}</b> · ${CITY[r.c]?CITY[r.c].n:""} · ${new Date(r.s).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}<br><span style="opacity:.7">${(r.m||"").replace(/</g,"&lt;")}</span></div>`).join("")||"<p>아직 기록이 없어요.</p>")+`<button class="btn g" onclick="closeM()">닫기</button>`)};
function autoPause(at){if(!ses.run)return;ses.base+=Math.max(0,at-ses.since);ses.run=false;save();toast("30분 이상 화면을 떠나 일시정지됐어요");upd()}
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now();save()}else if(ses.run&&hiddenAt&&Date.now()-hiddenAt>18e5)autoPause(hiddenAt+18e5)});
function upd(){const n=new Date();$("clock").textContent=f2(n.getHours())+":"+f2(n.getMinutes());
 $("date").textContent=n.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"});
 $("sub").textContent=preview!=null?`미리보기: 단계 ${preview}/3 (날짜 탭으로 변경)`:"";
 if(ses.on){$("clock2").textContent=hms(elapsed());$("bPause").textContent=ses.run?"일시정지":"다시 시작";$("sub2").textContent=(ses.run?"집중 중 · ":"일시정지 · ")+CITY[city].n}
 stage();sleepTick()}
$("date").onclick=()=>{if(ses.on)return;preview=preview==null?1:preview>=3?null:preview+1;stage(true);upd()};
setInterval(()=>{upd();if(ses.on&&Date.now()%5e3<1e3)save()},500);
mk();draw();
if(ses.on){city=ses.city||city;draw();if(ses.run&&Date.now()-ses.seen>18e5){autoPause(ses.seen+18e5)}else if(ses.run)toast("진행 중이던 타이머를 복구했어요");const e=elapsed();sleep=e>=36e5?{st:"sleep",at:e,cnt:0}:{st:"awake",at:0,cnt:0};if(e>=36e5)sleep.at=e-6e5;pose();view("run")}
stage(true);upd();
</script></body></html>
